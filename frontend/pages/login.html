<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArenaKick — Connexion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #16213e;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            color: #e94560;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .logo p {
            color: #a8a8b3;
            font-size: 14px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #a8a8b3;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #0f3460;
            border: 1px solid #1a4a7a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #e94560;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 8px;
        }

        .btn:hover {
            background: #c73652;
        }

        .btn:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .message.erreur {
            background: #2d1515;
            color: #e94560;
            border: 1px solid #e94560;
            display: block;
        }

        .message.succes {
            background: #152d1e;
            color: #4caf50;
            border: 1px solid #4caf50;
            display: block;
        }

        .lien {
            text-align: center;
            margin-top: 20px;
            color: #a8a8b3;
            font-size: 14px;
        }

        .lien a {
            color: #e94560;
            text-decoration: none;
            font-weight: 600;
        }

        .lien a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>⚽ ArenaKick</h1>
            <p>Plateforme de gestion de tournois</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Adresse email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="votre@email.com"
                    required
                />
            </div>

            <div class="form-group">
                <label for="motDePasse">Mot de passe</label>
                <input
                    type="password"
                    id="motDePasse"
                    placeholder="••••••••"
                    required
                />
            </div>

            <button type="submit" class="btn" id="btnConnexion">
                Se connecter
            </button>

            <div class="message" id="message"></div>
        </form>

        <div class="lien">
            Pas encore de compte ?
            <a href="register.html">S'inscrire</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000/api';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const motDePasse = document.getElementById('motDePasse').value;
            const btn = document.getElementById('btnConnexion');
            const message = document.getElementById('message');

            // Désactiver le bouton pendant la requête
            btn.disabled = true;
            btn.textContent = 'Connexion...';
            message.className = 'message';
            message.textContent = '';

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, motDePasse })
                });

                const data = await response.json();

                if (response.ok) {
                    // Sauvegarder le token et les infos utilisateur
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('utilisateur', JSON.stringify(data.utilisateur));

                    // Afficher le message de succès
                    message.className = 'message succes';
                    message.textContent = `Bienvenue ${data.utilisateur.prenom} !`;

                    // Rediriger vers le dashboard
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);

                } else {
                    message.className = 'message erreur';
                    message.textContent = data.erreur || 'Erreur de connexion';
                }

            } catch (error) {
                message.className = 'message erreur';
                message.textContent = 'Impossible de contacter le serveur';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Se connecter';
            }
        });
    </script>
</body>
</html>
