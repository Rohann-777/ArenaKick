<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArenaKick — Inscription</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #16213e;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            color: #e94560;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .logo p {
            color: #a8a8b3;
            font-size: 14px;
            margin-top: 4px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            color: #a8a8b3;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: #0f3460;
            border: 1px solid #1a4a7a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus { border-color: #e94560; }

        select option { background: #0f3460; }

        .role-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .role-card {
            padding: 14px;
            background: #0f3460;
            border: 2px solid #1a4a7a;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .role-card:hover { border-color: #e94560; }

        .role-card.selected {
            border-color: #e94560;
            background: #1a1a3e;
        }

        .role-card .role-icon {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .role-card .role-name {
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
        }

        .role-card .role-desc {
            color: #a8a8b3;
            font-size: 11px;
            margin-top: 4px;
        }

        .password-strength {
            margin-top: 6px;
            height: 4px;
            border-radius: 2px;
            background: #1a4a7a;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            border-radius: 2px;
            transition: all 0.3s;
        }

        .strength-text {
            font-size: 11px;
            margin-top: 4px;
            color: #a8a8b3;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 8px;
        }

        .btn:hover { background: #c73652; }
        .btn:disabled { background: #666; cursor: not-allowed; }

        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .message.erreur {
            background: #2d1515;
            color: #e94560;
            border: 1px solid #e94560;
            display: block;
        }

        .message.succes {
            background: #152d1e;
            color: #4caf50;
            border: 1px solid #4caf50;
            display: block;
        }

        .lien {
            text-align: center;
            margin-top: 20px;
            color: #a8a8b3;
            font-size: 14px;
        }

        .lien a {
            color: #e94560;
            text-decoration: none;
            font-weight: 600;
        }

        .lien a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>⚽ ArenaKick</h1>
            <p>Créer votre compte</p>
        </div>

        <form id="registerForm">

            <!-- Nom & Prénom -->
            <div class="form-row">
                <div class="form-group">
                    <label>Nom</label>
                    <input type="text" id="nom"
                        placeholder="RAKOTOJAONA" required/>
                </div>
                <div class="form-group">
                    <label>Prénom</label>
                    <input type="text" id="prenom"
                        placeholder="Rohann" required/>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>Adresse email</label>
                <input type="email" id="email"
                    placeholder="votre@email.com" required/>
            </div>

            <!-- Mot de passe -->
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="motDePasse"
                    placeholder="Minimum 8 caractères"
                    required oninput="verifierForce(this.value)"/>
                <div class="password-strength">
                    <div class="password-strength-bar"
                        id="strengthBar"></div>
                </div>
                <div class="strength-text" id="strengthText"></div>
            </div>

            <!-- Type utilisateur -->
            <div class="form-group">
                <label>Je suis...</label>
                <div class="role-grid" id="roleGrid">
                    <div class="role-card selected"
                        onclick="selectionnerRole('organisateur', this)">
                        <div class="role-icon">🏆</div>
                        <div class="role-name">Organisateur</div>
                        <div class="role-desc">Je crée des tournois</div>
                    </div>
                    <div class="role-card"
                        onclick="selectionnerRole('joueur', this)">
                        <div class="role-icon">⚽</div>
                        <div class="role-name">Joueur</div>
                        <div class="role-desc">Je participe</div>
                    </div>
                    <div class="role-card"
                        onclick="selectionnerRole('spectateur', this)">
                        <div class="role-icon">👁️</div>
                        <div class="role-name">Spectateur</div>
                        <div class="role-desc">Je suis les matchs</div>
                    </div>
                    <div class="role-card"
                        onclick="selectionnerRole('admin', this)">
                        <div class="role-icon">⚙️</div>
                        <div class="role-name">Administrateur</div>
                        <div class="role-desc">Accès complet</div>
                    </div>
                </div>
                <input type="hidden" id="typeUtilisateur"
                    value="organisateur"/>
            </div>

            <button type="submit" class="btn" id="btnInscription">
                Créer mon compte
            </button>

            <div class="message" id="message"></div>
        </form>

        <div class="lien">
            Déjà un compte ?
            <a href="login.html">Se connecter</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000/api';

        // ============================================================
        // Sélection du rôle
        // ============================================================
        function selectionnerRole(role, element) {
            document.querySelectorAll('.role-card')
                .forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('typeUtilisateur').value = role;
        }

        // ============================================================
        // Vérification force du mot de passe
        // ============================================================
        function verifierForce(motDePasse) {
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');

            let force = 0;
            if (motDePasse.length >= 8) force++;
            if (/[A-Z]/.test(motDePasse)) force++;
            if (/[0-9]/.test(motDePasse)) force++;
            if (/[^A-Za-z0-9]/.test(motDePasse)) force++;

            const niveaux = [
                { width: '0%', color: '#1a4a7a', text: '' },
                { width: '25%', color: '#e94560', text: 'Faible' },
                { width: '50%', color: '#ff9800', text: 'Moyen' },
                { width: '75%', color: '#4fc3f7', text: 'Bien' },
                { width: '100%', color: '#4caf50', text: 'Excellent !' },
            ];

            bar.style.width = niveaux[force].width;
            bar.style.background = niveaux[force].color;
            text.textContent = niveaux[force].text;
            text.style.color = niveaux[force].color;
        }

        // ============================================================
        // Soumission du formulaire
        // ============================================================
        document.getElementById('registerForm')
            .addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('btnInscription');
            const message = document.getElementById('message');

            btn.disabled = true;
            btn.textContent = 'Création du compte...';
            message.className = 'message';

            const data = {
                nom: document.getElementById('nom').value,
                prenom: document.getElementById('prenom').value,
                email: document.getElementById('email').value,
                motDePasse: document.getElementById('motDePasse').value,
                typeUtilisateur: document.getElementById('typeUtilisateur').value
            };

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    message.className = 'message succes';
                    message.textContent =
                        `Compte créé avec succès ! Redirection...`;
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    message.className = 'message erreur';
                    message.textContent = result.erreur;
                }

            } catch (error) {
                message.className = 'message erreur';
                message.textContent = 'Impossible de contacter le serveur';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Créer mon compte';
            }
        });
    </script>
</body>
</html>
